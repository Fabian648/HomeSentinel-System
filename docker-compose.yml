version: '3.8'
services:
  redis:
    image: redis:latest
    ports:
      - "6379:6379"

  backend:
    build: ./home-sentinel
    ports:
      - "8080:8080"
    depends_on:
      - redis

  simulator:
    build: ./sensor-simulator
    depends_on:
      - backend      
    environment:
      - BACKEND_URL=http://backend:8080
